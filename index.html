<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Sholat</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #081b25;
  color: white;
  font-family: Arial, sans-serif;
}
.card {
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
  border-radius: 25px;
  background: linear-gradient(145deg,#164c50,#102c3c);
  box-shadow: 0 10px 30px #0006;
}
h2 { margin: 0; font-size: 25px; }
.location { color: #b9d9d6; margin-top: 8px; }
.clock {
  font-size: 43px;
  font-weight: bold;
  margin: 25px 0 5px;
}
.date { color: #b9d9d6; }
.next {
  margin: 25px 0;
  padding: 18px;
  background: #ffffff18;
  border-radius: 16px;
}
.next small { color: #b9d9d6; }
.next h3 { font-size: 23px; margin: 8px 0; }
.prayer {
  display: flex;
  justify-content: space-between;
  padding: 15px 5px;
  border-bottom: 1px solid #ffffff25;
}
.active { color: #ffe18a; font-weight: bold; }
footer {
  text-align: center;
  color: #b9d9d6;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="card">
  <h2>🕌 Jadwal Sholat</h2>
  <div class="location">Aceh Tamiang, Aceh</div>

  <div class="clock" id="clock">00:00:00</div>
  <div class="date" id="date">Memuat tanggal...</div>

  <div class="next">
    <small>Waktu sholat berikutnya</small>
    <h3 id="next">Memuat...</h3>
    <div id="countdown">Mengambil jadwal...</div>
  </div>

  <div id="prayers">Memuat jadwal sholat...</div>
  <footer>Semoga hari ini penuh berkah 🤍</footer>
</div>

<script>
const names = {
  Fajr: "Subuh",
  Sunrise: "Terbit",
  Dhuhr: "Dzuhur",
  Asr: "Ashar",
  Maghrib: "Maghrib",
  Isha: "Isya"
};

let times = {};

function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("id-ID", {hour12:false});
  document.getElementById("date").textContent =
    now.toLocaleDateString("id-ID", {
      weekday:"long", day:"numeric",
      month:"long", year:"numeric"
    });
  updateNext();
}

function updateNext() {
  if (!Object.keys(times).length) return;

  const now = new Date();
  const order = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];
  let nextPrayer = null;
  let nextDate = null;

  for (const key of order) {
    const [h,m] = times[key].split(":").map(Number);
    const d = new Date();
    d.setHours(h,m,0,0);
    if (d > now) {
      nextPrayer = key;
      nextDate = d;
      break;
    }
  }

  if (!nextPrayer) {
    const [h,m] = times.Fajr.split(":").map(Number);
    nextDate = new Date();
    nextDate.setDate(nextDate.getDate()+1);
    nextDate.setHours(h,m,0,0);
    nextPrayer = "Fajr";
  }

  const diff = Math.max(0, nextDate-now);
  const hours = Math.floor(diff/3600000);
  const mins = Math.floor(diff%3600000/60000);
  const secs = Math.floor(diff%60000/1000);

  document.getElementById("next").textContent =
    names[nextPrayer] + " • " + times[nextPrayer];
  document.getElementById("countdown").textContent =
    `Dalam ${hours} jam ${mins} menit ${secs} detik`;
}

async function loadPrayer() {
  try {
    const url = "https://api.aladhan.com/v1/timingsByCity?city=Kuala%20Simpang&country=Indonesia&method=20";
    const response = await fetch(url);
    const result = await response.json();
    if (result.code !== 200) throw new Error();

    times = result.data.timings;
    document.getElementById("prayers").innerHTML =
      Object.keys(names).map(key => `
        <div class="prayer">
          <span>${names[key]}</span>
          <span>${times[key]}</span>
        </div>
      `).join("");
  } catch {
    document.getElementById("prayers").textContent =
      "Jadwal belum dapat dimuat. Periksa koneksi internet.";
  }
}

loadPrayer();
updateClock();
setInterval(updateClock,1000);
setInterval(loadPrayer,3600000);
</script>
</body>
</html>
